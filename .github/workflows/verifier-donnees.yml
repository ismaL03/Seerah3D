name: Vérifier les fiches

on:
  push:
    paths: ['data/**', 'tools/valider.py', '.github/workflows/verifier-donnees.yml']
  pull_request:
    paths: ['data/**', 'tools/valider.py', '.github/workflows/verifier-donnees.yml']

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/valider.py
